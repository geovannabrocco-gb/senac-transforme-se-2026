<h2>Meu formuário</h2>
<p>Preencha as informações abaixo:</p>
<form id="formRegister">

    Nome: <input id="iName" type="text" placeholder="Digite seu nome completo"/>
    Email: <input id= "iEmail" type="email" placeholder="Digite seu melhor email"/> <br>
    Senha: <input id= "iPass" type="password" placeholder="Letra maiuscula e números"/> 
    Data de nascimento: <input id= "iBirth" type="date" /><br>
    <br>
    <button type="submit">Salvar</button>
    
</form> 

<h2>Resposta</h2>
<pre id="pResponse"></pre>

<form id="formLogin">

    Email: <input id= "iEmailLogin" type="email" placeholder="Digite seu email cadastrado"/> <br>
    Senha: <input id= "iPassLogin" type="password" placeholder="Digite sua senha cadastrada"/> 

   
    <br>
    <button type="submit">Entrar</button>
    
</form>
